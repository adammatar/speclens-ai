[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speclens-worker"
version = "0.1.0"
description = "SpecLens AI Celery worker"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.4.0",
  "redis>=5.2.0",
  "pydantic-settings>=2.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
  "mypy>=1.15.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["speclens_worker*"]
