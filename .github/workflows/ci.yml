name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "services/api[dev]"
          python -m pip install -e "workers[dev]"

      - name: Ruff
        run: |
          ruff check services/api workers evals scripts
          ruff format --check services/api workers evals scripts

      - name: Mypy
        run: mypy --config-file=pyproject.toml

      - name: Pytest with coverage
        run: |
          mkdir -p artifacts
          python -m pip install coverage
          coverage run -m pytest
          # Lint job has no Postgres service; DB integration tests skip and
          # coverage settles ~58%. Keep a floor that still catches large drops.
          coverage report --fail-under=55
          coverage xml -o artifacts/coverage.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/coverage.xml
          if-no-files-found: warn

      - name: Contracts regenerate check
        run: |
          python scripts/export_openapi.py
          cd packages/contracts
          npm install
          npm run generate
          git diff --exit-code -- openapi.json src/generated.ts

      - name: Web build (React + Vite)
        run: |
          cd apps/web
          npm ci
          npm run build

  eval:
    name: Evaluation harness
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: speclens
          POSTGRES_PASSWORD: speclens_dev_password
          POSTGRES_DB: speclens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U speclens -d speclens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "services/api[dev]"
      - name: Migrate database
        env:
          DATABASE_URL: postgresql+psycopg://speclens:speclens_dev_password@127.0.0.1:5432/speclens
        run: |
          cd services/api
          alembic upgrade head
      - name: Run make eval (enforced)
        env:
          DATABASE_URL: postgresql+psycopg://speclens:speclens_dev_password@127.0.0.1:5432/speclens
          EMBEDDING_BACKEND: stub
          GENERATION_BACKEND: stub
          EXTRACTION_BACKEND: stub
          AUTH_REQUIRED: "false"
          EVAL_MODE: stub
        run: make eval EVAL_ENFORCE=1
      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: |
            artifacts/eval/report.json
            artifacts/eval/report.html
          if-no-files-found: warn

  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: |
          # Compose prefers optional ../.env; ensure a local file exists in CI.
          test -f .env || cp .env.example .env
          docker compose -f infra/compose.yaml up -d --build

      - name: Wait for health and ready
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8001/api/v1/health | grep -q '"status":"ok"'; then
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8001/api/v1/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8001/api/v1/ready | grep -q '"status":"ok"'; then
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8001/api/v1/ready | tee /tmp/ready.json
          grep -q '"status":"ok"' /tmp/ready.json

      - name: Enqueue noop worker job
        run: |
          docker compose -f infra/compose.yaml exec -T worker \
            python -c "from speclens_worker.tasks import noop_job; print(noop_job.delay({'ci': True}).get(timeout=30))"

      - name: Upload and ingest Markdown fixture
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer speclens-local-dev-key"
          # Health stays public; authenticated routes require the bootstrap key.
          CODE401=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8001/api/v1/documents/upload \
            -F "file=@services/api/tests/fixtures/sample.md;type=text/markdown")
          test "$CODE401" = "401"
          UPLOAD=$(curl -sf -X POST http://127.0.0.1:8001/api/v1/documents/upload \
            -H "$AUTH" \
            -F "file=@services/api/tests/fixtures/sample.md;type=text/markdown" \
            -F "title=CI Sample")
          echo "$UPLOAD"
          JOB_ID=$(python -c "import json,sys; print(json.loads(sys.argv[1])['job_id'])" "$UPLOAD")
          VER_ID=$(python -c "import json,sys; print(json.loads(sys.argv[1])['document_version_id'])" "$UPLOAD")
          for i in $(seq 1 30); do
            JOB=$(curl -sf -H "$AUTH" "http://127.0.0.1:8001/api/v1/documents/jobs/${JOB_ID}")
            STATUS=$(python -c "import json,sys; print(json.loads(sys.argv[1])['status'])" "$JOB")
            if [ "$STATUS" = "succeeded" ]; then
              break
            fi
            if [ "$STATUS" = "failed" ]; then
              echo "$JOB"
              exit 1
            fi
            sleep 1
          done
          test "$STATUS" = "succeeded"
          CHUNKS=$(curl -sf -H "$AUTH" "http://127.0.0.1:8001/api/v1/documents/versions/${VER_ID}/chunks")
          python -c "import json,sys; c=json.loads(sys.argv[1]); assert len(c) > 0" "$CHUNKS"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8001/api/v1/documents/upload \
            -H "$AUTH" \
            -F "file=@services/api/tests/fixtures/sample.md;type=text/markdown")
          test "$CODE" = "409"
          for i in $(seq 1 40); do
            COUNT=$(docker compose -f infra/compose.yaml exec -T postgres \
              psql -U speclens -d speclens -Atc "select count(*) from chunk_embeddings where document_version_id='${VER_ID}'")
            if [ "$COUNT" -gt 0 ]; then
              break
            fi
            sleep 1
          done
          test "$COUNT" -gt 0
          SEARCH=$(curl -sf -X POST http://127.0.0.1:8001/api/v1/search \
            -H "$AUTH" \
            -H 'Content-Type: application/json' \
            -d "{\"query\":\"hierarchical chunking\",\"document_version_ids\":[\"${VER_ID}\"],\"debug\":true}")
          python -c "import json,sys; d=json.loads(sys.argv[1]); assert d['results']; r=d['results'][0]; assert r['excerpt']; assert r['document_version_id']" "$SEARCH"
          CONV=$(curl -sf -X POST http://127.0.0.1:8001/api/v1/conversations \
            -H "$AUTH" \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI QA"}')
          CID=$(python -c "import json,sys; print(json.loads(sys.argv[1])['id'])" "$CONV")
          ANS=$(curl -sf -X POST "http://127.0.0.1:8001/api/v1/conversations/${CID}/messages" \
            -H "$AUTH" \
            -H 'Content-Type: application/json' \
            -d "{\"question\":\"What about Markdown uploads?\",\"document_version_ids\":[\"${VER_ID}\"]}")
          python -c "import json,sys; d=json.loads(sys.argv[1]); assert d['status'] in {'completed','insufficient_evidence'}; assert d['retrieval_status']; assert set(d.get('citation_chunk_ids') or []).issubset(set(d.get('retrieved_chunk_ids') or []))" "$ANS"
          EXT=$(curl -sf -H "$AUTH" -X POST "http://127.0.0.1:8001/api/v1/documents/versions/${VER_ID}/extractions")
          EJOB=$(python -c "import json,sys; print(json.loads(sys.argv[1])['job_id'])" "$EXT")
          for i in $(seq 1 40); do
            EJ=$(curl -sf -H "$AUTH" "http://127.0.0.1:8001/api/v1/extractions/${EJOB}")
            ESTATUS=$(python -c "import json,sys; print(json.loads(sys.argv[1])['status'])" "$EJ")
            if [ "$ESTATUS" = "succeeded" ]; then
              break
            fi
            if [ "$ESTATUS" = "failed" ]; then
              echo "$EJ"
              exit 1
            fi
            sleep 1
          done
          test "$ESTATUS" = "succeeded"
          REQS=$(curl -sf -H "$AUTH" "http://127.0.0.1:8001/api/v1/requirements?document_version_id=${VER_ID}")
          python -c "import json,sys; rows=json.loads(sys.argv[1]); assert rows; assert all(r.get('sources') and any((s.get('source_quote') or '').strip() for s in r['sources']) for r in rows); assert all(r.get('original_payload') for r in rows)" "$REQS"
          EXPORT=$(curl -sf -H "$AUTH" "http://127.0.0.1:8001/api/v1/requirements/export?format=json&document_version_id=${VER_ID}")
          python -c "import json,sys; rows=json.loads(sys.argv[1]); assert isinstance(rows, list) and rows" "$EXPORT"
          DOC_ID=$(python -c "import json,sys; print(json.loads(sys.argv[1])['document_id'])" "$UPLOAD")
          printf '%s\n\nThe system shall emit structured audit events for rejected uploads.\nCI compare %s\n' "$(cat services/api/tests/fixtures/sample.md)" "$RANDOM" > /tmp/sample-v2.md
          sed -i 's/preserve heading paths on every chunk/preserve heading paths on every chunk for navigation/' /tmp/sample-v2.md
          UP2=$(curl -sf -X POST "http://127.0.0.1:8001/api/v1/documents/${DOC_ID}/versions" \
            -H "$AUTH" \
            -F "file=@/tmp/sample-v2.md;type=text/markdown")
          VER2=$(python -c "import json,sys; print(json.loads(sys.argv[1])['document_version_id'])" "$UP2")
          JOB2=$(python -c "import json,sys; print(json.loads(sys.argv[1])['job_id'])" "$UP2")
          for i in $(seq 1 30); do
            JOB=$(curl -sf -H "$AUTH" "http://127.0.0.1:8001/api/v1/documents/jobs/${JOB2}")
            STATUS=$(python -c "import json,sys; print(json.loads(sys.argv[1])['status'])" "$JOB")
            if [ "$STATUS" = "succeeded" ] || [ "$STATUS" = "failed" ]; then break; fi
            sleep 1
          done
          test "$STATUS" = "succeeded"
          for i in $(seq 1 40); do
            COUNT=$(docker compose -f infra/compose.yaml exec -T postgres \
              psql -U speclens -d speclens -Atc "select count(*) from chunk_embeddings where document_version_id='${VER2}'")
            if [ "$COUNT" -gt 0 ]; then break; fi
            sleep 1
          done
          test "$COUNT" -gt 0
          EXT2=$(curl -sf -H "$AUTH" -X POST "http://127.0.0.1:8001/api/v1/documents/versions/${VER2}/extractions")
          EJOB2=$(python -c "import json,sys; print(json.loads(sys.argv[1])['job_id'])" "$EXT2")
          for i in $(seq 1 40); do
            EJ=$(curl -sf -H "$AUTH" "http://127.0.0.1:8001/api/v1/extractions/${EJOB2}")
            ESTATUS=$(python -c "import json,sys; print(json.loads(sys.argv[1])['status'])" "$EJ")
            if [ "$ESTATUS" = "succeeded" ] || [ "$ESTATUS" = "failed" ]; then break; fi
            sleep 1
          done
          test "$ESTATUS" = "succeeded"
          CMP=$(curl -sf -X POST http://127.0.0.1:8001/api/v1/comparisons \
            -H "$AUTH" \
            -H 'Content-Type: application/json' \
            -d "{\"base_document_version_id\":\"${VER_ID}\",\"target_document_version_id\":\"${VER2}\"}")
          CJOB=$(python -c "import json,sys; print(json.loads(sys.argv[1])['job_id'])" "$CMP")
          for i in $(seq 1 40); do
            CJ=$(curl -sf -H "$AUTH" "http://127.0.0.1:8001/api/v1/comparisons/${CJOB}")
            CSTATUS=$(python -c "import json,sys; print(json.loads(sys.argv[1])['status'])" "$CJ")
            if [ "$CSTATUS" = "succeeded" ] || [ "$CSTATUS" = "failed" ]; then break; fi
            sleep 1
          done
          test "$CSTATUS" = "succeeded"
          python -c "import json,sys; d=json.loads(sys.argv[1]); assert d['changes']; assert all((c.get('old_source_quote') or c.get('new_source_quote')) if c['category'] in ('added','removed') else (c.get('old_source_quote') and c.get('new_source_quote')) for c in d['changes']); open('/tmp/chg','w').write(d['changes'][0]['id'])" "$CJ"
          CHG=$(cat /tmp/chg)
          DEC=$(curl -sf -X PATCH "http://127.0.0.1:8001/api/v1/comparisons/changes/${CHG}" \
            -H "$AUTH" \
            -H 'Content-Type: application/json' -d '{"decision":"confirmed"}')
          python -c "import json,sys; d=json.loads(sys.argv[1]); assert d['decision']=='confirmed' and d['is_eval_example'] is True" "$DEC"

      - name: Tear down
        if: always()
        run: docker compose -f infra/compose.yaml down -v

  security:
    name: Security scans
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python packages for audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "services/api[dev]" pip-audit

      - name: pip-audit (API)
        # Policy: fail CI on reported vulnerabilities in the installed API environment.
        run: pip-audit --progress-spinner off

      - name: npm audit (web)
        working-directory: apps/web
        run: |
          npm ci
          # Policy: fail on high/critical only.
          npm audit --audit-level=high

      - name: Secret scan (gitleaks local, no upload)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --redact --exit-code 1

      - name: Filesystem vulnerability scan (Trivy)
        # 0.28.0 is not a published tag; pin a current release.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
