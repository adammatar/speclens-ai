name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "services/api[dev]"
          python -m pip install -e "workers[dev]"

      - name: Ruff
        run: |
          ruff check services/api workers
          ruff format --check services/api workers

      - name: Mypy
        run: mypy --config-file=pyproject.toml

      - name: Pytest
        run: python -m pytest

      - name: Contracts regenerate check
        run: |
          python scripts/export_openapi.py
          cd packages/contracts
          npm install
          npm run generate
          git diff --exit-code -- openapi.json src/generated.ts

  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose -f infra/compose.yaml up -d --build

      - name: Wait for health and ready
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/v1/health | grep -q '"status":"ok"'; then
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/v1/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/v1/ready | grep -q '"status":"ok"'; then
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/v1/ready | tee /tmp/ready.json
          grep -q '"status":"ok"' /tmp/ready.json

      - name: Enqueue noop worker job
        run: |
          docker compose -f infra/compose.yaml exec -T worker \
            python -c "from speclens_worker.tasks import noop_job; print(noop_job.delay({'ci': True}).get(timeout=30))"

      - name: Upload and ingest Markdown fixture
        run: |
          set -euo pipefail
          UPLOAD=$(curl -sf -X POST http://127.0.0.1:8000/api/v1/documents/upload \
            -F "file=@services/api/tests/fixtures/sample.md;type=text/markdown" \
            -F "title=CI Sample")
          echo "$UPLOAD"
          JOB_ID=$(python -c "import json,sys; print(json.loads(sys.argv[1])['job_id'])" "$UPLOAD")
          VER_ID=$(python -c "import json,sys; print(json.loads(sys.argv[1])['document_version_id'])" "$UPLOAD")
          for i in $(seq 1 30); do
            JOB=$(curl -sf "http://127.0.0.1:8000/api/v1/documents/jobs/${JOB_ID}")
            STATUS=$(python -c "import json,sys; print(json.loads(sys.argv[1])['status'])" "$JOB")
            if [ "$STATUS" = "succeeded" ]; then
              break
            fi
            if [ "$STATUS" = "failed" ]; then
              echo "$JOB"
              exit 1
            fi
            sleep 1
          done
          test "$STATUS" = "succeeded"
          CHUNKS=$(curl -sf "http://127.0.0.1:8000/api/v1/documents/versions/${VER_ID}/chunks")
          python -c "import json,sys; c=json.loads(sys.argv[1]); assert len(c) > 0" "$CHUNKS"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8000/api/v1/documents/upload \
            -F "file=@services/api/tests/fixtures/sample.md;type=text/markdown")
          test "$CODE" = "409"

      - name: Tear down
        if: always()
        run: docker compose -f infra/compose.yaml down -v
