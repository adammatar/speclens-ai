# Production-style SpecLens stack (API + worker + web + data plane).
# Postgres/Redis are not published to the host. Web terminates HTTP and proxies /api.
#
# Required env (no insecure defaults):
#   POSTGRES_PASSWORD  — strong secret (never speclens_dev_password)
# Optional: POSTGRES_USER, POSTGRES_DB, CORS_ORIGINS, SENTRY_DSN, WEB_PORT
name: speclens-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-speclens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production Compose}
      POSTGRES_DB: ${POSTGRES_DB:-speclens}
    volumes:
      - speclens_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-speclens} -d ${POSTGRES_DB:-speclens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    env_file:
      - path: ../.env.example
        required: true
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-speclens}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-speclens}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_LOCAL_ROOT: /data/storage
      SPECLENS_ENV: ${SPECLENS_ENV:-production}
      SPECLENS_DEPLOYMENT_MODE: hosted
      AUTH_REQUIRED: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - speclens_storage_prod:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    # Migrations only — never bootstrap-local in production.
    # Create keys with: docker compose ... exec api python -m app.cli keys create ...
    command: >
      sh -c "alembic upgrade head &&
             python -m app.cli check-startup &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ..
      dockerfile: workers/Dockerfile
    env_file:
      - path: ../.env.example
        required: true
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-speclens}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-speclens}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_LOCAL_ROOT: /data/storage
      SPECLENS_ENV: ${SPECLENS_ENV:-production}
      SPECLENS_DEPLOYMENT_MODE: hosted
      AUTH_REQUIRED: "true"
    volumes:
      - speclens_storage_prod:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  speclens_pgdata_prod:
  speclens_storage_prod:
