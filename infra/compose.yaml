name: speclens

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-speclens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-speclens_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-speclens}
    ports:
      - "5432:5432"
    volumes:
      - speclens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-speclens} -d ${POSTGRES_DB:-speclens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    # Defaults from .env.example; optional ../.env overrides (Gemini key, backends).
    env_file:
      - path: ../.env.example
        required: true
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://speclens:speclens_dev_password@postgres:5432/speclens
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_LOCAL_ROOT: /data/storage
      SPECLENS_ENV: local
    # Host 8001 avoids clashes with Cursor/other tools that often bind 127.0.0.1:8000.
    ports:
      - "8001:8000"
    volumes:
      - ../data/storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ..
      dockerfile: workers/Dockerfile
    env_file:
      - path: ../.env.example
        required: true
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://speclens:speclens_dev_password@postgres:5432/speclens
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_LOCAL_ROOT: /data/storage
      SPECLENS_ENV: local
    volumes:
      - ../data/storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  speclens_pgdata:
